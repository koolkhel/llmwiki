name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          # macOS matters for Unicode filename normalization (NFD on disk).
          - { os: macos-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / py${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # lxml 5.x (pinned via trafilatura 1.8) has no Python 3.14 wheels, so it
      # builds from source and needs the libxml2/libxslt headers on Linux.
      - name: System build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test (offline; the suite blocks network access)
        run: python -m pytest -q
