[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llmwiki"
version = "0.1.0"
description = "Deterministic bookkeeping CLI for an LLM-maintained markdown wiki (the LLM Wiki pattern), driven by Claude Code or Kimi Code."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Iurii Lunev", email = "koolkhel@mail.ru" }]
keywords = ["llm", "wiki", "knowledge-base", "obsidian", "claude-code", "kimi-code", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "mediacloud-metadata>=1.4,<2",
    # Used directly for markdown body extraction. 1.8.1 breaks list formatting
    # ("item\n-" instead of "- item"); mediacloud-metadata pins 1.8.*.
    "trafilatura==1.8.0",
    # lxml>=5.2 moved lxml.html.clean out; justext (via trafilatura) still imports it.
    "lxml_html_clean",
    # Search: Russian lemmatization (dictionary ~15 MB) and English stemming.
    "pymorphy3>=2.0",
    "snowballstemmer>=2.2",
]

[project.urls]
Homepage = "https://github.com/koolkhel/llmwiki"
Issues = "https://github.com/koolkhel/llmwiki/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wiki = "llmwiki.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/llmwiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]
